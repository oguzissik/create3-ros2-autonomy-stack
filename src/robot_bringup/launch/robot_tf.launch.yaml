launch:

  - node:
      pkg: "tf2_ros"
      exec: "static_transform_publisher"
      name: "base_footprint_and_base_link"
      args: "0.0 0.0 0.01 0.0 0.0 0.0 base_footprint base_link"

  - node:
      pkg: "tf2_ros"
      exec: "static_transform_publisher"
      name: "base_link_and_imu_link"
      args: "0.0 0.0 0.068 0.0 0.0 0.0 base_link imu_link"

  - node:
      pkg: "tf2_ros"
      exec: "static_transform_publisher"
      name: "base_link_and_laser_frame"
      args: "0.0 0.0 0.15 3.14159 0.0 0.0 base_link laser_frame"

  - node:
      pkg: "tf2_ros"
      exec: "static_transform_publisher"
      name: "base_link_and_Camera_link"
      args: "0.07 0.0 0.11 0.0 0.0 0.0 base_link camera_link"
